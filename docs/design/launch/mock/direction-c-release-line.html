<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch, direction C: the release line</title>
<link rel="stylesheet" href="base.css">
<style>
/* Direction C. The columns are the steps of a release, not the channels: each channel of a product sits as a tag
   in the step it has reached. The step that is the owner's (your yes) is one painted lane down the whole board. */
.head { display: flex; align-items: center; gap: 16px; padding: 14px 16px 14px 24px; border-bottom: 2px solid var(--edge); }
.head h1 { margin: 0; font: 800 32px/1 var(--sign); letter-spacing: 0.01em; }
.head .read { margin: 0 auto 0 4px; font-size: 14px; color: var(--muted); }
.line { display: grid; grid-template-columns: 210px repeat(5, minmax(0, 1fr)); margin: 18px 24px 28px; border: 2px solid var(--edge); border-radius: 10px; background: var(--raise); overflow: hidden; }
.line > * { min-width: 0; }
.st-h { padding: 10px 12px; font: 800 18px/1 var(--sign); letter-spacing: 0.02em; border-bottom: 2px solid var(--edge); background: var(--panel); }
.st-h small { display: block; margin-top: 4px; font: 400 12px/1.3 var(--body); color: var(--muted); letter-spacing: 0; }
.st-h.gate { background: var(--go); color: var(--go-ink); }
.st-h.gate small { color: #3d3209; }
.p { padding: 12px 12px 12px 14px; border-bottom: 1px solid var(--line); }
.p b { display: block; font: 800 22px/1 var(--sign); }
.p small { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
.slot { padding: 10px 8px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); display: grid; align-content: start; gap: 6px; }
.slot.gate { background: var(--yours); border-left: 2px solid var(--edge); border-right: 2px solid var(--edge); }
.tag { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 7px; padding: 6px 8px; border: 1.5px solid var(--line-strong); border-radius: 7px; background: var(--panel); font-size: 13px; line-height: 1.3; }
.tag .g { margin-top: 2px; }
.tag b { font-weight: 600; }
.tag span { grid-column: 2; color: var(--muted); }
.tag.bad { border-color: var(--red); }
.tag.bad span { color: var(--red); font-weight: 600; }
.slot.gate .tag { border-color: var(--edge); background: var(--raise); color: var(--text); }
.slot.gate .tag span { color: var(--muted); }
.tag small { grid-column: 2; font-size: 12px; color: var(--amber); }

@media (max-width: 699px) {
  .head { padding: 12px 12px 12px 16px; flex-wrap: wrap; gap: 6px 10px; }
  .head h1 { font-size: 28px; }
  .head .read { order: 3; flex-basis: 100%; margin: 0; }
  .head .btn.check { margin-left: auto; }
  .line { display: block; margin: 12px; border: 0; background: none; }
  .st-h { display: none; }
  .p { margin-top: 14px; border: 2px solid var(--edge); border-radius: 10px 10px 0 0; background: var(--raise); }
  .slot { border: 2px solid var(--edge); border-top: 0; background: var(--raise); }
  .slot:empty { display: none; }
  .slot::before { content: attr(data-st); font: 800 16px/1 var(--sign); }
  .slot.gate { border-left-width: 2px; border-right-width: 2px; }
}
</style>
</head>
<body>
<div class="shell" aria-hidden="true"></div>
<header class="top"><span class="mark">Botyard</span><span class="say">Lighthouse Labs</span></header>
<nav class="rail" aria-label="Pages"><span>Needs you</span><span>Work</span><span>Projects</span><span>Crew</span><span>Runs</span><span class="on">Launch</span><span>Setup</span></nav>
<main class="sheet" aria-labelledby="t">
  <div class="head">
    <h1 id="t">Launch</h1>
    <p class="read" id="read"></p>
    <button class="btn check" type="button">Check now</button>
    <button class="btn icon" type="button" aria-label="Close"></button>
  </div>
  <div class="sheet-body" id="body"></div>
</main>
<script src="data.js"></script>
<script src="glyphs.js"></script>
<script>
const L = window.LAUNCH
document.querySelector('.check').innerHTML = `${ICON.check} Check now`
document.querySelector('.btn.icon').innerHTML = ICON.close
document.getElementById('read').textContent = `Read from each channel ${L.readMinutesAgo} minutes ago`
const chName = Object.fromEntries(L.channels.map((c) => [c.id, c.name]))
const STAGES = [
  { id: 'unset', name: 'Not read yet', about: 'No key, no id, or no way to read it' },
  { id: 'gate', name: 'Your yes', about: 'Nothing moves until you say' },
  { id: 'review', name: 'In review', about: 'The store has it' },
  { id: 'live', name: 'Live', about: 'Read from the channel' },
  { id: 'down', name: 'Down', about: 'Was live, is not now' },
]
const tag = (id, c) => {
  const k = markOf(c)
  return `<div class="tag ${k === 'bad' ? 'bad' : ''}">${G[k]}<b>${esc(chName[id])}</b><span>${esc(c.state)}</span>${c.how === 'told' ? `<small>Told ${esc(c.age)} ago</small>` : ''}</div>`
}
let html = `<div class="line" role="table"><div class="st-h" role="columnheader">Product</div>${STAGES.map((s) => `<div class="st-h ${s.id === 'gate' ? 'gate' : ''}" role="columnheader">${s.name}<small>${s.about}</small></div>`).join('')}`
for (const r of L.rows) {
  html += `<div class="p" role="rowheader"><b>${esc(r.name)}</b><small>${esc(r.kind)}</small></div>`
  for (const s of STAGES) html += `<div class="slot ${s.id === 'gate' ? 'gate' : ''}" data-st="${s.name}">${Object.entries(r.cells).filter(([, c]) => c.stage === s.id).map(([id, c]) => tag(id, c)).join('')}</div>`
}
document.getElementById('body').innerHTML = html + '</div>'
// On a phone an empty step says nothing: drop its label too.
document.querySelectorAll('.slot').forEach((el) => { if (!el.querySelector('.tag')) el.innerHTML = '' })
</script>
</body>
</html>
