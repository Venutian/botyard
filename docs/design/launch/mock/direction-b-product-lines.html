<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch, direction B: one line per product</title>
<link rel="stylesheet" href="base.css">
<style>
/* Direction B. No grid of channels: each product is one line with only the channels it is on, and its next step
   on the right. A product that waits for you is painted, sorts first, and its step is the yellow key. */
.head { display: flex; align-items: center; gap: 16px; padding: 14px 16px 14px 24px; border-bottom: 2px solid var(--edge); }
.head h1 { margin: 0; font: 800 32px/1 var(--sign); letter-spacing: 0.01em; }
.head .sum { margin: 0 auto 0 4px; font-size: 15px; color: var(--text); }
.head .sum .y { font-weight: 600; }
.head .sum span.r { color: var(--muted); }
.list { list-style: none; margin: 0; padding: 16px 24px 28px; display: grid; gap: 10px; }
.prod { display: grid; grid-template-columns: 220px minmax(0, 1fr) 340px; gap: 0; border: 2px solid var(--edge); border-radius: 10px; background: var(--raise); box-shadow: 0 3px 0 var(--edge); overflow: hidden; }
.prod.yours { background: var(--yours); color: var(--yours-ink); }
.prod .who { padding: 14px 16px; border-right: 1px solid var(--line); }
.prod.yours .who { border-color: color-mix(in srgb, var(--yours-line) 45%, transparent); }
.prod .who b { display: block; font: 800 24px/1 var(--sign); letter-spacing: 0.01em; }
.prod .who small { display: block; margin-top: 5px; font-size: 13px; color: var(--muted); }
.prod.yours .who small { color: color-mix(in srgb, var(--yours-ink) 72%, var(--yours)); }
.chs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); align-content: start; }
.ch { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 0 -1px; }
.prod.yours .ch { border-color: color-mix(in srgb, var(--yours-line) 45%, transparent); }
.ch .n { font-size: 13px; color: var(--muted); }
.prod.yours .ch .n, .prod.yours .ch small { color: color-mix(in srgb, var(--yours-ink) 72%, var(--yours)); }
.ch .st { display: flex; align-items: baseline; gap: 7px; margin-top: 3px; font-size: 14px; line-height: 1.35; }
.ch .st .g { transform: translateY(1px); }
.ch.bad .st { color: var(--red); font-weight: 600; }
.ch.none .st { color: var(--muted); }
.ch small { display: block; margin: 2px 0 0 19px; font-size: 13px; color: var(--muted); }
.ch small.old { color: var(--amber); font-weight: 500; }
.next { padding: 14px 16px; border-left: 1px solid var(--line); display: grid; align-content: start; gap: 8px; }
.prod.yours .next { border-color: color-mix(in srgb, var(--yours-line) 45%, transparent); }
.next .w { font: 800 17px/1 var(--sign); letter-spacing: 0.02em; }
.prod.yours .next .w { color: inherit; }
.next p { margin: 0; font-size: 14px; line-height: 1.4; }
.next .more { font-size: 13px; color: var(--muted); }
.prod.yours .next .more { color: color-mix(in srgb, var(--yours-ink) 72%, var(--yours)); }
.next .btn { justify-self: start; }
.next.quiet p { color: var(--muted); }
.foot { margin: 0 24px 24px; font-size: 13px; color: var(--muted); }

@media (max-width: 1279px) { .prod { grid-template-columns: 200px minmax(0, 1fr) 300px; } }
@media (max-width: 699px) {
  .head { padding: 12px 12px 12px 16px; flex-wrap: wrap; gap: 6px 10px; }
  .head h1 { font-size: 28px; }
  .head .sum { order: 3; flex-basis: 100%; margin: 0; font-size: 14px; }
  .head .btn.check { margin-left: auto; }
  .list { padding: 12px 12px 24px; }
  .prod { grid-template-columns: minmax(0, 1fr); }
  .prod .who { border-right: 0; border-bottom: 1px solid var(--line); }
  .next { order: 2; border-left: 0; border-bottom: 1px solid var(--line); }
  .chs { order: 3; grid-template-columns: minmax(0, 1fr); }
  .ch { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 10px; border-right: 0; padding: 9px 14px; }
  .ch .st { margin: 0; }
  .ch small { grid-column: 2; margin-left: 19px; }
  .next .btn { min-height: 44px; }
}
</style>
</head>
<body>
<div class="shell" aria-hidden="true"></div>
<header class="top"><span class="mark">Botyard</span><span class="say">Lighthouse Labs</span></header>
<nav class="rail" aria-label="Pages"><span>Needs you</span><span>Work</span><span>Projects</span><span>Crew</span><span>Runs</span><span class="on">Launch</span><span>Setup</span></nav>
<main class="sheet" aria-labelledby="t">
  <div class="head">
    <h1 id="t">Launch</h1>
    <p class="sum" id="sum"></p>
    <button class="btn check" type="button">Check now</button>
    <button class="btn icon" type="button" aria-label="Close"></button>
  </div>
  <div class="sheet-body" id="body"></div>
</main>
<script src="data.js"></script>
<script src="glyphs.js"></script>
<script>
const L = window.LAUNCH
document.querySelector('.check').innerHTML = `${ICON.check} Check now`
document.querySelector('.btn.icon').innerHTML = ICON.close
const chName = Object.fromEntries(L.channels.map((c) => [c.id, c.name]))
const yoursOf = (r) => Object.entries(r.cells).filter(([, c]) => c.waits === 'you')
const rows = [...L.rows].sort((a, b) => yoursOf(b).length - yoursOf(a).length)
const total = L.rows.reduce((n, r) => n + yoursOf(r).length, 0)
document.getElementById('sum').innerHTML = `<span class="y">${total} steps wait for you.</span> <span class="r">Read from each channel ${L.readMinutesAgo} minutes ago.</span>`
const chHtml = (id, c) => {
  const k = markOf(c)
  const note = c.how === 'told' ? `<small class="${c.old ? 'old' : ''}">Told ${esc(c.age)} ago</small>` : c.since ? `<small>For ${esc(c.since)}</small>` : c.detail ? `<small>${esc(c.detail)}</small>` : ''
  return `<div class="ch ${k === 'bad' ? 'bad' : k === 'none' ? 'none' : ''}"><span class="n">${esc(chName[id])}</span><span class="st">${G[k]}<span>${esc(c.state)}</span></span>${note}</div>`
}
const nextHtml = (r) => {
  const y = yoursOf(r)
  if (y.length) {
    const [id, c] = y[0]
    return `<div class="next"><span class="w">Waits for you</span><p>${esc(c.next)}</p><button class="btn go" type="button">${esc(c.act)}</button>${y.length > 1 ? `<span class="more">And ${y.length - 1} more ${y.length - 1 === 1 ? 'step' : 'steps'} on its page</span>` : ''}</div>`
  }
  const o = Object.values(r.cells).find((c) => c.waits)
  if (o) return `<div class="next"><span class="w">Waits for ${esc(o.waits)}</span><p>${esc(o.next)}</p></div>`
  return `<div class="next quiet"><p>Nothing waits.</p></div>`
}
document.getElementById('body').innerHTML = `<ol class="list">${rows.map((r) => `<li class="prod ${yoursOf(r).length ? 'yours' : ''}" tabindex="0"><div class="who"><b>${esc(r.name)}</b><small>${esc(r.kind)}</small></div><div class="chs">${Object.entries(r.cells).map(([id, c]) => chHtml(id, c)).join('')}</div>${nextHtml(r)}</li>`).join('')}</ol>`
</script>
</body>
</html>
