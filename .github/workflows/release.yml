# Builds Botyard for each system and, for a version tag (v2.6.0), publishes them as a GitHub release.
#
#   a tag v*            tests, builds the desktop app for Linux, Windows and macOS and the phone app,
#                       then makes the release with the notes in docs/releases/<version>.md
#   run by hand         the same builds, kept as the run's files: nothing is published
#
# Nothing here is signed: the release notes say how to open an unsigned app on each system.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tests and the release check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Nothing personal, secret or heavy in the tree
        run: node tools/release-check.mjs
      - name: The service's tests
        working-directory: studio
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: The helper scripts' tests
        working-directory: crew
        run: python3 -m unittest discover -s tests
      - name: The phone app's tests
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: From a fresh clone to a first job
        working-directory: studio
        run: |
          git config --global user.name "Release check"
          git config --global user.email "check@botyard.invalid"
          node tools/fresh-clone-check.mjs
      - name: The tag and the app's version agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./desktop/package.json').version")"
          test "$want" = "$have" || { echo "The tag is v$want but desktop/package.json says $have"; exit 1; }
          test -f "docs/releases/$want.md" || { echo "docs/releases/$want.md is missing: it is the release's notes"; exit 1; }

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, target: --linux }
          - { name: Windows, os: windows-latest, target: --win }
          - { name: macOS, os: macos-latest, target: --mac }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the map
        working-directory: studio
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build the app
        working-directory: desktop
        env:
          # No certificate is looked for: the builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error

  phone:
    name: Phone app (Android)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the Android project
        run: |
          npm ci --no-audit --no-fund
          npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: android
        # Signed with the Android project's public test key (the same in every build, so a newer APK
        # installs over an older one). It is not a store key, and the release notes say so.
        run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Name it
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Botyard-phone-$version-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: phone-Android
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, phone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" files/* --title "Botyard $version" --notes-file "docs/releases/$version.md" --verify-tag
